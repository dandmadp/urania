name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          # Oldest dependency versions allowed by pyproject.toml
          - os: ubuntu-latest
            python: "3.10"
            resolution: lowest-direct
          - os: windows-latest
            python: "3.11"
            resolution: highest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install --system --resolution ${{ matrix.resolution }} ".[dev]"
        env:
          UV_SYSTEM_PYTHON: "1"
      - name: Test
        run: python -m pytest -q
        env:
          MPLBACKEND: Agg
