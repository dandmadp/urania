name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          # Oldest dependency versions allowed by pyproject.toml
          - os: ubuntu-latest
            python: "3.10"
            resolution: lowest-direct
          - os: windows-latest
            python: "3.11"
            resolution: highest
    steps:
      - uses: actions/checkout@v5
      # Install the requested Python and create + activate a virtual environment (.venv)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install --resolution ${{ matrix.resolution }} ".[dev]" pytest-github-actions-annotate-failures
      - name: Versions
        run: uv run --no-project python -c "import sys, numpy, scipy, astropy, matplotlib, sgp4, urania; print(sys.version, numpy.__version__, scipy.__version__, astropy.__version__, matplotlib.__version__, sgp4.__version__, urania.__file__)"
      - name: Test
        run: uv run --no-project python -m pytest -q -rf
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
