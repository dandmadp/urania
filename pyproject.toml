[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urania"
version = "0.0.1"
description = "An astrodynamics library that computes, shows and explains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "sgp4>=2.22",
    "astropy>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/urania"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
